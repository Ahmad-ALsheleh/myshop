name: myshop
description: "MyShop - Flutter e-commerce application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  # Navigation
  go_router: ^16.0.0
  # Forms & validation
  reactive_forms: ^18.0.0
  # Persist user settings (theme / language)
  shared_preferences: ^2.3.0
  # Formatting (version is pinned by flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  # Images are cropped from the design screenshots in design/.
  # Sub-folders must be listed one by one.
  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/categories/
    - assets/images/banners/
    - assets/images/delivery/
    - assets/images/payment/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: assets/icons/app_icon_background.png
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#4A3757"
  image: assets/icons/splash_logo.png
  android_12:
    color: "#4A3757"
    image: assets/icons/app_icon_foreground.png
